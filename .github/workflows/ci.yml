name: CI

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  windows:
    name: Compilación y pruebas (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Clonar repositorio con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preparar entorno (.NET SDK y FFmpeg)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\preparar-entorno.ps1

      - name: Compilar Release con -warnaserror
        shell: pwsh
        run: build\dotnet.cmd build src\Subtitular.slnx -c Release -warnaserror

      - name: Pruebas rápidas
        shell: pwsh
        run: build\dotnet.cmd test src\Subtitular.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Subir resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults/**/*.trx
          if-no-files-found: ignore
